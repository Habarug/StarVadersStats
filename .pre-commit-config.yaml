---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.3.5

    hooks:
      # Make ruff sort imports
      - id: ruff
        args: [check, --select, I, --fix]

      # Run the formatter.
      - id: ruff-format


  - repo: https://github.com/kieran-ryan/pyprojectsort
    rev: v0.4.0
    hooks:
      - id: pyprojectsort
