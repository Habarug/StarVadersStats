[build-system]
requires        = ["setuptools"]
build-baclemd   = "setuptools.build_meta"

[project]
name        = "StarVadersStats"
version     = "0.1"
description = "Python package to plot StarVaders stats"
readme      = "README.md"
authors     = [{name = "Habarug"}]

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "wikitextparser",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.ruff]
exclude = ["*__init__.py"]
lint.extend-select = ["I"]
